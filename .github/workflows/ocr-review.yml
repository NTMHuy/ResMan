
name: Open Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Review Pull Request
        uses: alibaba/open-code-review@main
        with:
          # DRAFT: verify the expected URL format in the action
          llm_url: 'https://api.groq.com/openai/v1/chat/completions'

          # Configure this in GitHub repository Secrets
          llm_auth_token: ${{ secrets.GROQ_API_KEY }}

          # DRAFT: verify this model ID is available to your Groq account
          llm_model: 'openai/gpt-oss-20b'

          llm_use_anthropic: 'false'
          sticky_summary: 'true'
